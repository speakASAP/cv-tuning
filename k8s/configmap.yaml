apiVersion: v1
kind: ConfigMap
metadata:
  name: cv-tuning-config
  namespace: statex-apps
  labels:
    app: cv-tuning
data:
  NODE_ENV: "production"
  PORT: "3379"
  AUTH_SERVICE_URL: "http://auth-microservice:3370"
  # Auth confirms account existence for the fail-safe offboarding reconciliation path.
  AUTH_USER_LOOKUP_URL: "http://auth-microservice:3370/internal/users"
  AUTH_USER_LOOKUP_SERVICE_NAME: "cv-tuning"
  AI_SERVICE_URL: "http://ai-microservice:3380"
  LOGGING_SERVICE_URL: "http://logging-microservice:3367"
  MINIO_ENDPOINT: "http://minio-microservice:9000"
  # Phase 5, spec §5. The in-cluster Service names, verified against `kubectl get svc -n
  # statex-apps`: the workflow plane is `business-process-control-plane`, not `bpcp`.
  CV_BPCP_SERVICE_URL: "http://business-process-control-plane:3375"
  CV_NOTIFICATIONS_SERVICE_URL: "http://notifications-microservice:3368"
  # Phase 5 runs on the owner's own data only (no third-party users before Phase 7).
  CV_NUDGE_RECIPIENT: "ssfskype@gmail.com"
