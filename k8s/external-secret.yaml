apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cv-tuning-secret
  namespace: statex-apps
  labels:
    app: cv-tuning
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cv-tuning-secret
    creationPolicy: Owner
  data:
    - secretKey: CV_DATABASE_URL
      remoteRef:
        key: secret/prod/cv-tuning
        property: CV_DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/ai-microservice
        property: JWT_SECRET
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: secret/prod/cv-tuning
        property: MINIO_ACCESS_KEY
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: secret/prod/cv-tuning
        property: MINIO_SECRET_KEY
    - secretKey: MINIO_BUCKET
      remoteRef:
        key: secret/prod/cv-tuning
        property: MINIO_BUCKET
    # Phase 5, spec §5. The nudge callback is NOT under CvAuthGuard (BPCP's dispatcher posts
    # with no user credential), so this shared secret is what authenticates it. The same value
    # is read by business-process-control-plane, which sends it as x-cv-nudge-secret.
    - secretKey: CV_NUDGE_CALLBACK_SECRET
      remoteRef:
        key: secret/prod/cv-tuning
        property: CV_NUDGE_CALLBACK_SECRET
    # Bearer token for notifications-microservice, whose JwtRolesGuard resolves it as the
    # scoped machine actor `service:cv-tuning`. Stored at this service's own Vault path and
    # referenced by notifications-microservice's ExternalSecret, so there is exactly one copy.
    - secretKey: NOTIFICATIONS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/cv-tuning
        property: NOTIFICATIONS_SERVICE_TOKEN
